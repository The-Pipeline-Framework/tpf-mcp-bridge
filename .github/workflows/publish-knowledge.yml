name: Publish released TPF knowledge

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact released TPF version
        required: true
      framework_commit:
        description: Full Git commit for the released tag
        required: true
      tag:
        description: Exact vX.Y.Z release tag
        required: true

permissions:
  contents: read

concurrency:
  group: publish-tpf-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout MCP service
        uses: actions/checkout@v4
      - name: Checkout exact TPF release
        uses: actions/checkout@v4
        with:
          repository: The-Pipeline-Framework/pipelineframework
          ref: ${{ inputs.tag }}
          path: .framework-release
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Validate release event
        env:
          VERSION: ${{ inputs.version }}
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = "v$VERSION"
          test "${#FRAMEWORK_COMMIT}" -eq 40
          test "$(git -C .framework-release rev-parse HEAD)" = "$FRAMEWORK_COMMIT"
      - name: Compile and publish matching Repowise knowledge
        env:
          VERSION: ${{ inputs.version }}
          FRAMEWORK_COMMIT: ${{ inputs.framework_commit }}
        run: |
          npm run publish:knowledge -- \
            --framework-dir "$GITHUB_WORKSPACE/.framework-release" \
            --version "$VERSION" \
            --repowise-r2-commit "$FRAMEWORK_COMMIT" \
            --wait-for-repowise-seconds 600 \
            --environment production \
            --publish
